apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kuberay-operator
  namespace: kuberay-system
  labels:
    app.kubernetes.io/name: kuberay-operator
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberay-operator
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
